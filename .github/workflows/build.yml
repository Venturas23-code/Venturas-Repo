name: Build Kodi Repository

on:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Criar ZIP
              run: |
                VERSION=$(grep -oP 'version="\K[^"]+' plugin.video.moviebox/addon.xml)

                mkdir -p repository/plugin.video.moviebox

                zip -r repository/plugin.video.moviebox/plugin.video.moviebox-$VERSION.zip plugin.video.moviebox

            - name: Copiar addon.xml
              run:
                cp plugin.video.moviebox/addon.xml repository/plugin.video.moviebox/

            - name: Gerar addons.xml
              run: |
                echo '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' > repository/addons.xml
                echo '<addons>' >> repository/addons.xml

                cat plugin.video.meuaddon/addon.xml >> repository/addons.xml

                echo '</addons>' >> repository/addons.xml

            - name: Gerar MD5
              run: |
                md5sum repository/addons.xml | awk '{print $1}' > repository/addons.xml.md5

            - name: Publicar GitHub Pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                github_token: ${{ secrets.GITHUB_TOKEN }}
                publish_dir: ./repository